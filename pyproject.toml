[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surgiguard"
version = "0.1.0"
description = "Uncertainty-aware temporal surgical video intelligence research prototype"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "pillow>=10.0",
  "matplotlib>=3.8",
  "onnx>=1.16",
  "onnxruntime>=1.17",
]

[tool.setuptools.packages.find]
where = ["src"]

